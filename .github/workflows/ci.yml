name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend, Go, and container checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies without lifecycle scripts
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify frontend dependency graph
        working-directory: web
        run: |
          pnpm peers check
          pnpm audit --audit-level high
      - name: Lint, test, and build frontend
        working-directory: web
        run: |
          pnpm lint
          pnpm test
          pnpm build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Verify Go modules and generated Ent code
        run: |
          go mod verify
          go generate ./ent
          git diff --exit-code -- ent
      - name: Vet and race-test Go
        run: |
          go vet ./...
          go test -race ./...
      - name: Build embedded pure-Go binary
        env:
          CGO_ENABLED: '0'
        run: |
          rm -rf webdist/dist
          cp -R web/dist webdist/dist
          go build -trimpath -o /tmp/tailcat-webui ./cmd/tailcat-webui

      - uses: docker/setup-buildx-action@v3
      - name: Verify container build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
