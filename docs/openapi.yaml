openapi: 3.1.0
info:
  title: Tailcat WebUI API
  version: 0.1.0
  description: Owner-scoped management API for Tailcat server and client runtimes.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200': { description: Healthy, content: { application/json: { schema: { type: object } } } }
  /config:
    get:
      security: []
      operationId: publicConfig
      responses:
        '200':
          description: Public deployment configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicConfig' }
  /auth/login:
    get:
      security: []
      operationId: startOIDCLogin
      parameters:
        - { in: query, name: return_to, schema: { type: string, default: / } }
      responses:
        '302': { description: Redirect to the OIDC provider }
  /auth/callback:
    get:
      security: []
      operationId: completeOIDCLogin
      parameters:
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code, required: true, schema: { type: string } }
      responses:
        '302': { description: Session created and redirected to the console }
  /auth/demo:
    post:
      security: []
      operationId: demoLogin
      responses:
        '200': { description: Demo session created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Session revoked }
  /auth/me:
    get:
      operationId: currentUser
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /dashboard:
    get:
      operationId: dashboard
      responses:
        '200': { description: Owner dashboard summary, content: { application/json: { schema: { type: object } } } }
  /servers:
    get:
      operationId: listServers
      responses:
        '200': { description: Owner servers, content: { application/json: { schema: { $ref: '#/components/schemas/ServerList' } } } }
    post:
      operationId: createServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, key_mode]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                key_mode: { type: string, enum: [ephemeral, saved] }
                region: { type: string, default: auto }
                derp_map_url: { type: string, format: uri }
                exit_node_enabled: { type: boolean, const: false, default: false, description: Enable later after creating at least one enabled exit rule }
                start: { type: boolean, default: false }
      responses:
        '201': { description: Server created, content: { application/json: { schema: { $ref: '#/components/schemas/Server' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /servers/{id}:
    delete:
      operationId: deleteServer
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Server deleted }
        '404': { $ref: '#/components/responses/Error' }
  /servers/{id}/start:
    post:
      operationId: startServer
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Running server, content: { application/json: { schema: { $ref: '#/components/schemas/Server' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /servers/{id}/stop:
    post:
      operationId: stopServer
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Server stopped }
        '409': { $ref: '#/components/responses/Error' }
  /servers/{id}/exit-node:
    post:
      operationId: setExitNodeEnabled
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: Updated server, content: { application/json: { schema: { $ref: '#/components/schemas/Server' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /servers/{id}/exit-rules:
    get:
      operationId: listExitRules
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Owner-scoped exit rules, content: { application/json: { schema: { $ref: '#/components/schemas/ExitRuleList' } } } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createExitRule
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prefix, start_port, end_port, enabled]
              properties:
                prefix: { type: string, description: IPv4 or IPv6 CIDR prefix }
                start_port: { type: integer, minimum: 1, maximum: 65535 }
                end_port: { type: integer, minimum: 1, maximum: 65535 }
                enabled: { type: boolean }
      responses:
        '201': { description: Exit rule created, content: { application/json: { schema: { $ref: '#/components/schemas/ExitRule' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /exit-rules/{id}:
    delete:
      operationId: deleteExitRule
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Exit rule deleted }
        '404': { $ref: '#/components/responses/Error' }
  /servers/{id}/mappings:
    get:
      operationId: listMappings
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Server mappings, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: createMapping
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind, listen_port]
              properties:
                name: { type: string }
                kind: { type: string, enum: [tcp, no_auth_ssh] }
                listen_port: { type: integer, minimum: 1, maximum: 65535, description: Ports 41640 and 41641 are reserved for bounded Tailcat services and are rejected. }
                target_host: { type: string }
                target_port: { type: integer, minimum: 0, maximum: 65535 }
      responses:
        '201': { description: Mapping created, content: { application/json: { schema: { type: object } } } }
  /mappings/{id}:
    delete:
      operationId: deleteMapping
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Mapping deleted }
  /servers/{id}/allowed-clients:
    get:
      operationId: listAllowedClients
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Allowed public keys, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: createAllowedClient
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, public_key]
              properties:
                name: { type: string }
                public_key: { type: string, pattern: '^nodekey:' }
      responses:
        '201': { description: Public key allowed, content: { application/json: { schema: { type: object } } } }
  /allowed-clients/{id}:
    delete:
      operationId: deleteAllowedClient
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Allowed key removed; restart a running server to revoke it }
  /clients:
    get:
      operationId: listClients
      responses:
        '200': { description: Owner clients, content: { application/json: { schema: { $ref: '#/components/schemas/ClientList' } } } }
    post:
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, server]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                server: { type: string, description: Tailcat token or DNS name }
                derp_map_url: { type: string, format: uri }
                save_identity: { type: boolean, default: false }
      responses:
        '201': { description: Client created, content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } } }
  /clients/{id}:
    delete:
      operationId: deleteClient
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Client deleted }
  /clients/{id}/ping:
    post:
      operationId: pingClient
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Updated client path, content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } } }
  /clients/{id}/diagnostics:
    post:
      operationId: startDiagnostic
      description: Start one bounded diagnostic against the selected owner-scoped Tailcat client on reserved port 41640. No network target is accepted.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, duration_ms]
              properties:
                kind: { type: string, enum: [ping, throughput] }
                duration_ms: { type: integer, minimum: 1, maximum: 5000 }
                bytes: { type: integer, minimum: 0, maximum: 33554432, description: Must be zero for ping and positive for throughput; applies independently to upload and download. }
      responses:
        '201': { description: Durable running summary created before the peer dial, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticRun' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /diagnostics:
    get:
      operationId: listDiagnostics
      description: List up to 100 owner-scoped diagnostic summaries from the last 30 days.
      responses:
        '200': { description: Owner diagnostic history, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticRunList' } } } }
  /diagnostics/{id}/cancel:
    post:
      operationId: cancelDiagnostic
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Cancellation requested }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /clients/{id}/tunnel:
    get:
      operationId: tunnelClient
      description: Same-origin WebSocket upgrade whose byte stream is connected through the selected Tailcat client only after the origin check succeeds.
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { in: query, name: address, required: true, schema: { type: string, example: 'server.tailcat:80' } }
      responses:
        '101': { description: WebSocket tunnel established }
  /tokens/parse:
    post:
      operationId: parseToken
      requestBody: { $ref: '#/components/requestBodies/Token' }
      responses:
        '200': { description: Parsed token fields, content: { application/json: { schema: { type: object } } } }
  /tokens/resolve:
    post:
      operationId: resolveToken
      requestBody: { $ref: '#/components/requestBodies/Token' }
      responses:
        '200': { description: Self-contained token, content: { application/json: { schema: { type: object } } } }
  /routes:
    get:
      operationId: listRoutes
      responses:
        '200': { description: Owner routes, content: { application/json: { schema: { $ref: '#/components/schemas/RouteList' } } } }
    post:
      operationId: createRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_id, name, slug, remote_port, base_path, access]
              properties:
                client_id: { type: string, format: uuid }
                name: { type: string }
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$' }
                remote_port: { type: integer, minimum: 1, maximum: 65535 }
                base_path: { type: string, pattern: '^/' }
                access: { type: string, enum: [private, public] }
                allowed_methods:
                  type: array
                  items: { type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS] }
                  default: [GET, HEAD]
      responses:
        '201': { description: Route created, content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
  /routes/{id}:
    delete:
      operationId: deleteRoute
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Route deleted }
  /routes/{id}/open:
    get:
      operationId: openPrivateRoute
      description: Issue a short-lived scoped grant and redirect the owner to the separate published-resource origin.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '303': { description: Redirect to the published route with a one-minute grant }
        '404': { $ref: '#/components/responses/Error' }
  /transfers/shares:
    get:
      operationId: listTransferShares
      description: List outgoing shares owned by the authenticated principal. Capability material is never returned.
      responses:
        '200': { description: Owner-scoped outgoing shares, content: { application/json: { schema: { $ref: '#/components/schemas/TransferShareList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTransferShare
      description: Create a staging share with the configured expiry (24 hours by default). The capability is returned once in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [server_id]
              properties:
                server_id: { type: string, format: uuid, description: Existing TailServer owned by the principal }
      responses:
        '201': { description: Staging share and one-time capability, content: { application/json: { schema: { $ref: '#/components/schemas/TransferShareCreated' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/shares/{id}:
    get:
      operationId: getTransferShare
      description: Get one owner-scoped outgoing share without capability material.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Outgoing share, content: { application/json: { schema: { $ref: '#/components/schemas/TransferShare' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTransferShare
      description: Revoke streams and delete an owner-scoped share and staged bytes.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Share deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/shares/{id}/files:
    get:
      operationId: listTransferShareFiles
      description: List browser-visible metadata for files staged in an owner-scoped share. Storage names and hashes are omitted.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Share files, content: { application/json: { schema: { $ref: '#/components/schemas/TransferShareFileList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: uploadTransferShareFile
      description: >-
        Stream one raw browser-selected file into a staging share. This is the only
        management route exempt from the global 1 MiB body limit; authentication,
        origin/CSRF, mutation rate/admission, configured MaxBytesReader and upload
        deadline controls still apply. The default maximum is 512 MiB/file, with
        1 GiB/share, 2 GiB/owner, 1,000 files/share and a 30-minute timeout.
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - in: header
          name: X-Tailcat-Virtual-Path
          required: true
          description: Canonical relative slash path; UTF-8, at most 1024 bytes and 32 segments; no host path, control character, absolute path, dot segment, backslash, colon, or Windows device name.
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - in: header
          name: Content-Length
          required: true
          description: Exact non-negative byte length. Zero-byte files are valid.
          schema: { type: integer, format: int64, minimum: 0, maximum: 536870912 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 536870912 }
      responses:
        '201': { description: Staged file metadata, content: { application/json: { schema: { $ref: '#/components/schemas/TransferShareFile' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/shares/{id}/finalize:
    post:
      operationId: finalizeTransferShare
      description: Explicitly make a non-empty staging share immutable and ready for receivers.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Ready share, content: { application/json: { schema: { $ref: '#/components/schemas/TransferShare' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/shares/{id}/rotate:
    post:
      operationId: rotateTransferShareCapability
      description: Revoke the prior capability and return the replacement exactly once.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: One-time replacement capability, content: { application/json: { schema: { $ref: '#/components/schemas/TransferCapabilityRotated' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/jobs:
    get:
      operationId: listTransferJobs
      description: List incoming jobs owned by the authenticated principal. Capability ciphertext and hashes are omitted.
      responses:
        '200': { description: Owner-scoped incoming jobs, content: { application/json: { schema: { $ref: '#/components/schemas/TransferJobList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTransferJob
      description: Resolve a capability through one selected existing TailClient and create a ready incoming job. Start it with the explicit start operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_id, capability]
              properties:
                client_id: { type: string, format: uuid, description: Existing TailClient owned by the principal }
                capability: { type: string, pattern: '^tcs1\.[A-Za-z0-9_-]{64}$', description: One-time-sensitive share capability; never returned by job endpoints }
      responses:
        '201': { description: Ready incoming job, content: { application/json: { schema: { $ref: '#/components/schemas/TransferJob' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/jobs/{id}:
    get:
      operationId: getTransferJob
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Incoming job, content: { application/json: { schema: { $ref: '#/components/schemas/TransferJob' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTransferJob
      description: Cancel if active and delete the owner-scoped job and received bytes.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Job deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/jobs/{id}/start:
    post:
      operationId: startTransferJob
      description: Start a ready incoming job using exactly four workers and the configured 1..2 active-job owner limit (default 2).
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Running job, content: { application/json: { schema: { $ref: '#/components/schemas/TransferJob' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/jobs/{id}/cancel:
    post:
      operationId: cancelTransferJob
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Cancellation requested and active I/O interrupted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/jobs/{id}/retry:
    post:
      operationId: retryTransferJob
      description: Resume a failed, canceled, or interrupted job using verified completed blocks.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Running retried job, content: { application/json: { schema: { $ref: '#/components/schemas/TransferJob' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/jobs/{id}/items:
    get:
      operationId: listTransferJobItems
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Owner-scoped job items, content: { application/json: { schema: { $ref: '#/components/schemas/TransferItemList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/jobs/{id}/items/{item_id}:
    get:
      operationId: getTransferJobItem
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/ItemID' }
      responses:
        '200': { description: Owner-scoped job item, content: { application/json: { schema: { $ref: '#/components/schemas/TransferItem' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /transfers/jobs/{id}/items/{item_id}/download:
    get:
      operationId: downloadTransferJobItem
      description: Stream only a completed item from a completed owner-scoped job. Missing, incomplete and foreign resources all return 404. Range reads remain bounded to the opened item.
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/ItemID' }
        - in: header
          name: Range
          required: false
          description: Optional single RFC 7233 byte range handled by http.ServeContent.
          schema: { type: string, pattern: '^bytes=' }
      responses:
        '200':
          description: Complete received file
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, format: int64, minimum: 0 }, description: Exact item length }
            Content-Disposition: { schema: { type: string }, description: Safe RFC 6266/5987 attachment filename derived from the virtual basename }
            Last-Modified: { schema: { type: string }, description: RFC 1123 item modification time used for conditionals }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '206':
          description: Bounded byte range of the completed file
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Disposition: { schema: { type: string } }
            Content-Range: { schema: { type: string } }
            Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
            Last-Modified: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '304':
          description: Not modified; no body or Content-Length
          headers:
            Last-Modified: { schema: { type: string } }
        '412':
          description: If-Unmodified-Since precondition failed; no body or Content-Length
          headers:
            Last-Modified: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '416':
          description: Multi-range, invalid, or unsatisfiable range; no file body
          headers:
            Content-Range: { schema: { type: string }, description: 'bytes */<exact-size>' }
        '503': { $ref: '#/components/responses/Error' }
    head:
      operationId: headTransferJobItemDownload
      description: Return the same safe completed-item headers as GET without a response body.
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/ItemID' }
        - in: header
          name: Range
          required: false
          schema: { type: string, pattern: '^bytes=' }
      responses:
        '200':
          description: Completed item headers
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Disposition: { schema: { type: string } }
            Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
            Last-Modified: { schema: { type: string } }
        '206':
          description: Completed single-range headers
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Disposition: { schema: { type: string } }
            Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
            Content-Range: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
        '304':
          description: Not modified
          headers:
            Last-Modified: { schema: { type: string } }
        '412':
          description: Precondition failed
          headers:
            Last-Modified: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '416':
          description: Invalid or unsatisfiable range
          headers:
            Content-Range: { schema: { type: string } }
        '503': { $ref: '#/components/responses/Error' }
  /events:
    get:
      operationId: runtimeEvents
      responses:
        '200':
          description: Server-sent runtime and diagnostic events sharing one owner-scoped sequence.
          content:
            text/event-stream: { schema: { $ref: '#/components/schemas/RuntimeEvent' } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tailcat_session
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    ItemID:
      in: path
      name: item_id
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token]
            properties:
              token: { type: string }
  responses:
    Error:
      description: Machine-readable error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    PublicConfig:
      type: object
      additionalProperties: false
      required: [auth_mode, unsafe_ssh, version, transfers]
      properties:
        auth_mode: { type: string, enum: [oidc, demo] }
        unsafe_ssh: { type: boolean }
        version: { type: string }
        transfers: { $ref: '#/components/schemas/PublicTransferConfig' }
    PublicTransferConfig:
      type: object
      additionalProperties: false
      description: >-
        Lower byte/count/job/lifetime values may tighten these defaults; workers
        remain exactly four. Values above the compiled hard maxima are rejected at startup. Byte values use exact IEC
        units in environment configuration (B, KiB, MiB, GiB or TiB; positive
        integers only, surrounding whitespace and unit case are accepted).
      required: [max_file_bytes, max_share_bytes, max_job_bytes, max_owner_bytes, max_files_per_share, workers, max_jobs_per_owner, expiry_seconds, retention_seconds, upload_timeout_seconds]
      properties:
        max_file_bytes: { type: integer, format: int64, minimum: 1, maximum: 536870912, default: 536870912, description: TAILCAT_WEBUI_TRANSFER_MAX_FILE_BYTES }
        max_share_bytes: { type: integer, format: int64, minimum: 1, maximum: 1073741824, default: 1073741824, description: TAILCAT_WEBUI_TRANSFER_MAX_SHARE_BYTES }
        max_job_bytes: { type: integer, format: int64, minimum: 1, maximum: 1073741824, default: 1073741824, description: TAILCAT_WEBUI_TRANSFER_MAX_JOB_BYTES }
        max_owner_bytes: { type: integer, format: int64, minimum: 1, maximum: 2147483648, default: 2147483648, description: TAILCAT_WEBUI_TRANSFER_MAX_OWNER_BYTES }
        max_files_per_share: { type: integer, minimum: 1, maximum: 1000, default: 1000, description: TAILCAT_WEBUI_TRANSFER_MAX_FILES_PER_SHARE }
        workers: { type: integer, const: 4, default: 4, description: TAILCAT_WEBUI_TRANSFER_WORKERS; any value other than 4 is rejected }
        max_jobs_per_owner: { type: integer, minimum: 1, maximum: 2, default: 2, description: TAILCAT_WEBUI_TRANSFER_MAX_JOBS_PER_OWNER }
        expiry_seconds: { type: integer, format: int64, minimum: 1, maximum: 86400, default: 86400, description: TAILCAT_WEBUI_TRANSFER_EXPIRY, parsed with Go duration syntax and capped at 24h }
        retention_seconds: { type: integer, format: int64, minimum: 1, maximum: 86400, default: 86400, description: Compatibility alias TAILCAT_WEBUI_TRANSFER_RETENTION; it must match expiry when both environment variables are set }
        upload_timeout_seconds: { type: integer, format: int64, minimum: 1, maximum: 3600, default: 1800, description: TAILCAT_WEBUI_TRANSFER_UPLOAD_TIMEOUT, capped at 1h }
    TransferStatus:
      type: string
      enum: [staging, ready, running, completed, failed, canceled, interrupted, expired, deleting]
    TransferErrorCode:
      type: string
      enum: [transfer_canceled, transfer_expired, transfer_remote_unavailable, transfer_invalid_capability, transfer_share_not_found, transfer_protocol_invalid, transfer_integrity_mismatch, transfer_storage_failed, transfer_limit_exceeded]
    TransferEventStatus:
      type: string
      enum: [staging, ready, running, completed, failed, canceled, interrupted, expired, deleting, deleted]
    TransferShare:
      type: object
      additionalProperties: false
      required: [id, server_id, status, total_bytes, file_count, expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TransferStatus' }
        total_bytes: { type: integer, format: int64, minimum: 0, maximum: 1073741824 }
        file_count: { type: integer, minimum: 0, maximum: 1000 }
        expires_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TransferShareCreated:
      type: object
      additionalProperties: false
      required: [share, capability]
      properties:
        share: { $ref: '#/components/schemas/TransferShare' }
        capability: { type: string, pattern: '^tcs1\.[A-Za-z0-9_-]{64}$', description: Returned exactly once; never persisted in plaintext or returned by list/get }
    TransferCapabilityRotated:
      type: object
      additionalProperties: false
      required: [capability]
      properties:
        capability: { type: string, pattern: '^tcs1\.[A-Za-z0-9_-]{64}$', description: Returned exactly once; replaces and revokes the previous code }
    TransferShareFile:
      type: object
      additionalProperties: false
      required: [id, virtual_path, size, mtime, created_at]
      properties:
        id: { type: string, format: uuid }
        virtual_path: { type: string, minLength: 1, maxLength: 1024 }
        size: { type: integer, format: int64, minimum: 0, maximum: 536870912 }
        mtime: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    TransferJob:
      type: object
      additionalProperties: false
      required: [id, client_id, remote_share_id, status, total_bytes, received_bytes, expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        remote_share_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TransferStatus' }
        total_bytes: { type: integer, format: int64, minimum: 0, maximum: 1073741824 }
        received_bytes: { type: integer, format: int64, minimum: 0, maximum: 1073741824 }
        expires_at: { type: string, format: date-time }
        error_code: { $ref: '#/components/schemas/TransferErrorCode' }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TransferItem:
      type: object
      additionalProperties: false
      required: [id, job_id, virtual_path, size, status, received_bytes, completed_blocks, mtime, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        virtual_path: { type: string, minLength: 1, maxLength: 1024 }
        size: { type: integer, format: int64, minimum: 0, maximum: 536870912 }
        status: { $ref: '#/components/schemas/TransferStatus' }
        received_bytes: { type: integer, format: int64, minimum: 0, maximum: 536870912 }
        completed_blocks: { type: integer, minimum: 0, maximum: 64 }
        mtime: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TransferShareList:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/TransferShare' } } }
    TransferShareFileList:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/TransferShareFile' } } }
    TransferJobList:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/TransferJob' } } }
    TransferItemList:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/TransferItem' } } }
    TransferEventPayload:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        share_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TransferEventStatus' }
        received_bytes: { type: integer, format: int64, minimum: 0 }
        total_bytes: { type: integer, format: int64, minimum: 0 }
        completed_files: { type: integer, minimum: 0 }
        total_files: { type: integer, minimum: 0, maximum: 1000 }
        error_code: { $ref: '#/components/schemas/TransferErrorCode' }
    User:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar_url: { type: string, format: uri }
    Server:
      type: object
      required: [id, name, key_mode, region, runtime_state]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_mode: { type: string, enum: [ephemeral, saved] }
        region: { type: string }
        runtime_state: { $ref: '#/components/schemas/RuntimePhase' }
        connection_token: { type: string, description: Present only while running }
        public_key: { type: string }
        exit_node_enabled: { type: boolean }
        allowlist_enabled: { type: boolean }
        desired_running: { type: boolean }
        mapping_count: { type: integer }
        allowed_key_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExitRule:
      type: object
      required: [id, server_id, prefix, start_port, end_port, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        prefix: { type: string }
        start_port: { type: integer, minimum: 1, maximum: 65535 }
        end_port: { type: integer, minimum: 1, maximum: 65535 }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Client:
      type: object
      required: [id, name, runtime_state, token_hint]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        runtime_state: { $ref: '#/components/schemas/RuntimePhase' }
        token_hint: { type: string }
        public_key: { type: string }
        last_ping_ms: { type: integer }
        last_path: { type: string, enum: [direct, derp, peer-relay] }
        derp_map_url: { type: string, format: uri }
        saved_key: { type: boolean }
        last_ping_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Route:
      type: object
      required: [id, client_id, name, slug, remote_port, access, url]
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        remote_port: { type: integer }
        base_path: { type: string }
        access: { type: string, enum: [private, public] }
        allowed_methods: { type: array, items: { type: string } }
        url: { type: string, format: uri }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DiagnosticRun:
      type: object
      additionalProperties: false
      required: [id, client_id, kind, status, upload_bytes, download_bytes, upload_bps, download_bps, started_at]
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        kind: { type: string, enum: [ping, throughput] }
        status: { type: string, enum: [running, succeeded, failed, canceled, interrupted] }
        path: { type: string, enum: [direct, derp, peer_relay] }
        latency_ms: { type: integer, minimum: 0 }
        upload_bytes: { type: integer, minimum: 0, maximum: 33554432 }
        download_bytes: { type: integer, minimum: 0, maximum: 33554432 }
        upload_bps: { type: integer, minimum: 0 }
        download_bps: { type: integer, minimum: 0 }
        error_code: { $ref: '#/components/schemas/DiagnosticErrorCode' }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    DiagnosticErrorCode:
      type: string
      enum: [diagnostic_canceled, diagnostic_timeout, diagnostic_invalid_magic, diagnostic_header_too_large, diagnostic_malformed_header, diagnostic_invalid_request, diagnostic_limit_exceeded, diagnostic_io, diagnostic_invalid_runner]
    DiagnosticEventPayload:
      type: object
      additionalProperties: false
      required: [client_id, kind, status, progress]
      properties:
        client_id: { type: string, format: uuid }
        kind: { type: string, enum: [ping, throughput] }
        status: { type: string, enum: [running, succeeded, failed, canceled, interrupted] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        latency_ms: { type: integer, minimum: 0 }
        upload_bytes: { type: integer, minimum: 0, maximum: 33554432 }
        download_bytes: { type: integer, minimum: 0, maximum: 33554432 }
        upload_bps: { type: integer, minimum: 0 }
        download_bps: { type: integer, minimum: 0 }
        error_code: { $ref: '#/components/schemas/DiagnosticErrorCode' }
    ServerList:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Server' } } }
    ExitRuleList:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/ExitRule' } } }
    ClientList:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Client' } } }
    DiagnosticRunList:
      type: object
      required: [items]
      properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/DiagnosticRun' } } }
    RouteList:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Route' } } }
    RuntimePhase:
      type: string
      enum: [idle, starting, connecting, ready, running, stopping, stopped, error, interrupted]
    RuntimeEvent:
      type: object
      additionalProperties: false
      required: [version, type, resource_kind, resource_id, phase, sequence, at]
      properties:
        version: { type: integer }
        type: { type: string, enum: [runtime, diagnostic, transfer] }
        resource_kind: { type: string }
        resource_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        phase: { $ref: '#/components/schemas/RuntimePhase' }
        sequence: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        payload:
          oneOf:
            - { $ref: '#/components/schemas/DiagnosticEventPayload' }
            - { $ref: '#/components/schemas/TransferEventPayload' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
